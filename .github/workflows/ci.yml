# ── TaxPro CI Pipeline ──
# Runs on every push to main and every PR

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  security-events: write

jobs:
  # ── 0. Security Scan ──
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true

      - name: Scan for secrets with trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ── 1. Lint, Test & SAST ──
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taxpro
          POSTGRES_PASSWORD: taxpro
          POSTGRES_DB: taxpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Create test .env (mirrors local dev — env.ts loads ../../.env)
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgres://taxpro:taxpro@localhost:5432/taxpro
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=ci-test-secret-key-not-for-production-use
          DATA_ENCRYPTION_KEY=test-data-encryption-key-min-32-chars!!
          NODE_ENV=test
          EOF

      - name: Bootstrap DB roles (taxpro_app, taxpro_migrations)
        run: psql -h localhost -U taxpro -d taxpro -v ON_ERROR_STOP=1 -f apps/api/scripts/bootstrap-roles.sql
        env:
          PGPASSWORD: taxpro

      - name: Run DB migrations (CI Postgres starts empty)
        run: npm run db:migrate -w @taxpro/api
        env:
          DATABASE_URL_MIGRATIONS: postgres://taxpro:taxpro@localhost:5432/taxpro
          NODE_ENV: test

      - name: Seed DB (api-security tests log in as demo@taxpro.ai)
        run: npm run db:seed -w @taxpro/api
        env:
          DATABASE_URL: postgres://taxpro:taxpro@localhost:5432/taxpro
          DATABASE_URL_MIGRATIONS: postgres://taxpro:taxpro@localhost:5432/taxpro
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-not-for-production-use
          DATA_ENCRYPTION_KEY: test-data-encryption-key-min-32-chars!!
          NODE_ENV: test

      - name: Lint (TypeScript compile check)
        run: npm run lint

      - name: Run tests (all workspaces)
        run: npm test
        env:
          DATABASE_URL: postgres://taxpro:taxpro@localhost:5432/taxpro
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-not-for-production-use
          DATA_ENCRYPTION_KEY: test-data-encryption-key-min-32-chars!!
          NODE_ENV: test

      - name: Build API
        run: npm run build -w packages/tax-engine && npm run build -w packages/tax-engine-enterprise && npm run build -w apps/api
        env:
          DATABASE_URL: postgres://taxpro:taxpro@localhost:5432/taxpro
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-not-for-production-use
          DATA_ENCRYPTION_KEY: test-data-encryption-key-min-32-chars!!
          NODE_ENV: test

      - name: Build Web
        run: npm run build -w apps/web

      - name: AI Mapping Eval (dry-run — accuracy check when AI configured)
        run: npm run eval:ai-mapping -w @taxpro/api || echo "⚠ eval:ai-mapping skipped (no AI provider or dry-run)"
        env:
          DATABASE_URL: postgres://taxpro:taxpro@localhost:5432/taxpro
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-not-for-production-use
          DATA_ENCRYPTION_KEY: test-data-encryption-key-min-32-chars!!
          NODE_ENV: test

      - name: Agent Harness (mocked mode — structure validation of all 16 fixtures)
        run: npm run harness -w @taxpro/api
        env:
          AI_EVAL_MODE: mocked
          DATABASE_URL: postgres://taxpro:taxpro@localhost:5432/taxpro
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-not-for-production-use
          DATA_ENCRYPTION_KEY: test-data-encryption-key-min-32-chars!!
          NODE_ENV: test

  # ── 2. Docker Build & Vulnerability Scan ──
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: taxpro-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: taxpro-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan on API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taxpro-api:latest
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy API results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-api-results.sarif'
          category: trivy-api

      - name: Run Trivy vulnerability scan on Web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taxpro-web:latest
          format: 'sarif'
          output: 'trivy-web-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy Web results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-web-results.sarif'
          category: trivy-web
