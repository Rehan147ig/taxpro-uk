# ── SAST — Semgrep (free, OSS, fail-closed) ──
# Runs the community security + JS/TS rule packs on every push/PR.
# Rules run locally match: p/security-audit p/typescript p/javascript

name: SAST

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/typescript
            p/javascript
          auditOn: push
          auditOnly: false
